<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard Controller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { darkbg: '#0f172a', cardbg: '#1e293b', cardborder: '#334155' } } } }
    </script>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen p-4 md:p-8 font-sans">
    <div class="max-w-4xl mx-auto space-y-6">
        <header class="bg-cardbg border border-cardborder p-6 rounded-2xl shadow-xl flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-white uppercase tracking-wider">Admin Control Panel</h1>
                <p class="text-xs text-slate-400 mt-1">Manage live figures reflected on the user portfolio & history statement.</p>
            </div>
            <button onclick="saveChanges()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold uppercase tracking-wider px-5 py-2.5 rounded-xl transition shadow-lg cursor-pointer">
                Save & Push Updates
            </button>
        </header>

        <!-- Main Stats Config -->
        <div class="bg-cardbg border border-cardborder p-6 rounded-2xl shadow-xl space-y-4">
            <h2 class="text-sm font-mono uppercase tracking-wider text-blue-400">Portfolio Overview Numbers</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Total PnL</label>
                    <input type="text" id="admin-pnl" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Invested Amount</label>
                    <input type="text" id="admin-invested" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Debt Owed</label>
                    <input type="text" id="admin-debt" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
                </div>
            </div>
        </div>

        <!-- Ledger Manager -->
        <div class="bg-cardbg border border-cardborder p-6 rounded-2xl shadow-xl space-y-4">
            <h2 class="text-sm font-mono uppercase tracking-wider text-amber-400">Add Account History Transaction</h2>
            <div class="grid grid-cols-1 md:grid-cols-5 gap-3">
                <input type="text" id="new-date" placeholder="Date (e.g. Aug 5, 2026)" class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
                <input type="text" id="new-desc" placeholder="Description" class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
                <input type="text" id="new-channel" placeholder="Channel (VISA/USDT)" class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
                <input type="text" id="new-amount" placeholder="Amount (+/-$0.00)" class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
                <button onclick="addLedgerItem()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-lg p-2.5 uppercase tracking-wider">Add Row</button>
            </div>
        </div>
    </div>

    <script>
        function loadAdminData() {
            const data = JSON.parse(localStorage.getItem('dashboard_state')) || {
                invested: "$39,705.00",
                debt: "$14,706.00",
                totalPnl: "+$4,250.00",
                assets: [
                    { name: "Gold (XAU/USD)", type: "Spot Scalp", pnl: "+$2,450.00", status: "Active" },
                    { name: "USDT Reserves", type: "Liquid Vault", pnl: "+$1,800.00", status: "Secure" }
                ],
                ledger: []
            };

            document.getElementById('admin-pnl').value = data.totalPnl;
            document.getElementById('admin-invested').value = data.invested;
            document.getElementById('admin-debt').value = data.debt;
        }

        function saveChanges() {
            let data = JSON.parse(localStorage.getItem('dashboard_state')) || { assets: [], ledger: [] };
            data.totalPnl = document.getElementById('admin-pnl').value;
            data.invested = document.getElementById('admin-invested').value;
            data.debt = document.getElementById('admin-debt').value;

            localStorage.setItem('dashboard_state', JSON.stringify(data));
            alert("Changes saved and published to user dashboard successfully!");
        }

        function addLedgerItem() {
            let data = JSON.parse(localStorage.getItem('dashboard_state')) || { assets: [], ledger: [] };
            const newItem = {
                date: document.getElementById('new-date').value,
                desc: document.getElementById('new-desc').value,
                channel: document.getElementById('new-channel').value,
                amount: document.getElementById('new-amount').value,
                status: "Cleared"
            };
            data.ledger.unshift(newItem);
            localStorage.setItem('dashboard_state', JSON.stringify(data));
            alert("New history record added!");
        }

        window.onload = loadAdminData;
    </script>
</body>
</html>
