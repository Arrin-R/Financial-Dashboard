<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard Controller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { darkbg: '#0f172a', cardbg: '#1e293b', cardborder: '#334155' } } } }
    </script>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen p-4 md:p-8 font-sans">
    <div class="max-w-4xl mx-auto space-y-6">
        <header class="bg-cardbg border border-cardborder p-6 rounded-2xl shadow-xl flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-white uppercase tracking-wider">Admin Control Panel</h1>
                <p class="text-xs text-slate-400 mt-1">Manage live figures and history records for the user dashboard.</p>
            </div>
            <button onclick="saveAdminData()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold uppercase tracking-wider px-5 py-2.5 rounded-xl transition shadow-lg cursor-pointer">
                Save & Push Updates
            </button>
        </header>

        <!-- Main Stats Config -->
        <div class="bg-cardbg border border-cardborder p-6 rounded-2xl shadow-xl space-y-4">
            <h2 class="text-sm font-mono uppercase tracking-wider text-blue-400">Portfolio Overview Numbers</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Total PnL</label>
                    <input type="text" id="admin-pnl" placeholder="+$4,250.00" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Invested Amount</label>
                    <input type="text" id="admin-invested" value="$39,705.00" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Debt Owed</label>
                    <input type="text" id="admin-debt" value="$14,706.00" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
                </div>
            </div>
        </div>

        <!-- Custom Ledger Table Override HTML -->
        <div class="bg-cardbg border border-cardborder p-6 rounded-2xl shadow-xl space-y-4">
            <h2 class="text-sm font-mono uppercase tracking-wider text-amber-400">Account History Table HTML</h2>
            <p class="text-xs text-slate-400">You can paste or edit raw table row HTML (<code>&lt;tr&gt;...&lt;/tr&gt;</code>) here to fully update or add rows to the user's account history statement.</p>
            <textarea id="admin-ledger-html" rows="8" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs font-mono text-white focus:outline-none focus:border-blue-500"></textarea>
        </div>
    </div>

    <script>
        function loadAdmin() {
            const saved = localStorage.getItem('dashboard_state');
            if (saved) {
                const data = JSON.parse(saved);
                document.getElementById('admin-pnl').value = data.totalPnl || '';
                document.getElementById('admin-invested').value = data.invested || '$39,705.00';
                document.getElementById('admin-debt').value = data.debt || '$14,706.00';
                if (data.customLedgerHtml) {
                    document.getElementById('admin-ledger-html').value = data.customLedgerHtml;
                }
            }
        }

        function saveAdminData() {
            const data = {
                totalPnl: document.getElementById('admin-pnl').value,
                invested: document.getElementById('admin-invested').value,
                debt: document.getElementById('admin-debt').value,
                customLedgerHtml: document.getElementById('admin-ledger-html').value
            };
            localStorage.setItem('dashboard_state', JSON.stringify(data));
            alert("Admin updates published successfully!");
        }

        window.onload = loadAdmin;
    </script>
</body>
</html>
