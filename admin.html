<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                        cardborder: '#334155',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen p-4 md:p-8 font-sans">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Admin Header -->
        <div class="flex justify-between items-center bg-cardbg border border-cardborder px-6 py-4 rounded-2xl shadow-xl">
            <div>
                <h1 class="text-xl font-bold text-white uppercase tracking-wider">Dashboard Admin Control</h1>
                <p class="text-xs text-slate-400">Modify financial metrics, active positions, and account history records in real-time.</p>
            </div>
            <a href="index.html" target="_blank" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-4 py-2 rounded-xl transition uppercase tracking-wider">
                View Live Dashboard &rarr;
            </a>
        </div>

        <!-- General Inputs Form -->
        <div class="bg-cardbg border border-cardborder p-6 rounded-2xl shadow-xl space-y-4">
            <h2 class="text-sm font-mono text-blue-400 uppercase tracking-wider">Global Summary Values</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Global Invested Amount ($ USD)</label>
                    <input type="number" step="any" id="admin-invested" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white font-mono text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Debt Owed ($ USD)</label>
                    <input type="number" step="any" id="admin-debt" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white font-mono text-sm focus:outline-none focus:border-blue-500">
                </div>
            </div>
        </div>

        <!-- Asset Manager -->
        <div class="bg-cardbg border border-cardborder p-6 rounded-2xl shadow-xl space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-sm font-mono text-blue-400 uppercase tracking-wider">Active Assets & Auto PnL Calculator</h2>
                <span class="text-[11px] text-slate-400">PnL = Invested × ((Current - Entry) / Entry)</span>
            </div>
            <div id="admin-assets-container" class="space-y-4">
                <!-- Loaded via JS -->
            </div>
            <button onclick="addAssetRow()" class="bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 font-semibold px-4 py-2 rounded-lg transition uppercase tracking-wider">
                + Add New Asset Card
            </button>
        </div>

        <!-- Account History / Ledger Manager -->
        <div class="bg-cardbg border border-cardborder p-6 rounded-2xl shadow-xl space-y-4">
            <h2 class="text-sm font-mono text-blue-400 uppercase tracking-wider">Account History Ledger Editor</h2>
            <div id="admin-ledger-container" class="space-y-4">
                <!-- Loaded via JS -->
            </div>
            <button onclick="addLedgerRow()" class="bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 font-semibold px-4 py-2 rounded-lg transition uppercase tracking-wider">
                + Add Ledger Entry
            </button>
        </div>

        <!-- Save Button -->
        <button onclick="saveChanges()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 px-6 rounded-xl transition shadow-lg text-sm uppercase tracking-wider cursor-pointer">
            Save Changes & Update Dashboard
        </button>

    </div>

    <script>
        const defaultData = {
            globalInvested: 39705.00,
            debtOwed: 14706.00,
            assets: [
                { name: 'XAU/USD Gold Spot', type: 'Precious Metals / Spot', investedAmount: 10000, buyPrice: 2332.50, currentPrice: 2385.20, pnl: '+1,317.50' },
                { name: 'EUR/USD Major Pair', type: 'Foreign Exchange', investedAmount: 8000, buyPrice: 1.0850, currentPrice: 1.0892, pnl: '+309.68' },
                { name: 'GBP/USD Cable', type: 'Foreign Exchange', investedAmount: 6000, buyPrice: 1.2720, currentPrice: 1.2685, pnl: '-165.09' },
                { name: 'USD/JPY Cross', type: 'Foreign Exchange', investedAmount: 5000, buyPrice: 154.20, currentPrice: 155.10, pnl: '+291.83' },
                { name: 'BTC/USD Bitcoin', type: 'Cryptocurrency Asset', investedAmount: 6000, buyPrice: 64200.00, currentPrice: 67500.00, pnl: '+308.41' },
                { name: 'US30 Dow Jones', type: 'Global Index', investedAmount: 4705, buyPrice: 38900.00, currentPrice: 39250.00, pnl: '+423.52' }
            ],
            ledger: [
                { date: 'June 11, 2026', desc: 'Capital Deposit Made', channel: 'Wire', amount: '+$36,765.00', status: 'Settled' },
                { date: 'June 11, 2026', desc: 'Capital Deposit Made', channel: 'USDT', amount: '+$2,940.00', status: 'Settled' },
                { date: 'July 29, 2026', desc: 'Interest Payment Made', channel: 'VISA', amount: '$1,838.25', status: 'Pending' }
            ]
        };

        let currentData = JSON.parse(localStorage.getItem('dashboardData')) || defaultData;

        currentData.assets.forEach(asset => {
            if (asset.investedAmount === undefined) asset.investedAmount = 5000;
        });

        const availableDates = [
            'June 1, 2026', 'June 11, 2026', 'June 20, 2026', 
            'July 1, 2026', 'July 15, 2026', 'July 29, 2026', 
            'August 1, 2026', 'August 5, 2026', 'August 10, 2026',
            'September 1, 2026', 'October 1, 2026', 'November 1, 2026', 'December 1, 2026'
        ];

        const availableGateways = ['Wire', 'VISA', 'MasterCard', 'USDT'];
        const availableStatuses = ['Settled', 'Pending'];

        function loadAdminForm() {
            document.getElementById('admin-invested').value = currentData.globalInvested;
            document.getElementById('admin-debt').value = currentData.debtOwed;

            // Render Asset Editors
            const assetContainer = document.getElementById('admin-assets-container');
            assetContainer.innerHTML = '';
            currentData.assets.forEach((asset, idx) => {
                assetContainer.innerHTML += `
                    <div class="bg-slate-900/60 border border-slate-800 p-4 rounded-xl grid grid-cols-1 md:grid-cols-4 gap-3 text-xs">
                        <div class="md:col-span-2">
                            <label class="text-slate-400 block mb-1">Asset Name</label>
                            <input type="text" value="${asset.name}" id="asset-name-${idx}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-white">
                        </div>
                        <div>
                            <label class="text-slate-400 block mb-1">Asset Type</label>
                            <input type="text" value="${asset.type}" id="asset-type-${idx}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-white">
                        </div>
                        <div>
                            <label class="text-slate-400 block mb-1">Invested Amount ($)</label>
                            <input type="number" step="any" value="${asset.investedAmount}" id="asset-inv-${idx}" oninput="calculateRowPnl(${idx})" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-white font-mono">
                        </div>
                        <div>
                            <label class="text-slate-400 block mb-1">Entry Price</label>
                            <input type="number" step="any" value="${asset.buyPrice}" id="asset-buy-${idx}" oninput="calculateRowPnl(${idx})" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-white font-mono">
                        </div>
                        <div>
                            <label class="text-slate-400 block mb-1">Current Price</label>
                            <input type="number" step="any" value="${asset.currentPrice}" id="asset-curr-${idx}" oninput="calculateRowPnl(${idx})" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-white font-mono">
                        </div>
                        <div>
                            <label class="text-slate-400 block mb-1">Auto-Calculated PnL</label>
                            <input type="text" readonly value="${asset.pnl}" id="asset-pnl-preview-${idx}" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 font-mono font-bold ${asset.pnl.startsWith('-') ? 'text-rose-400' : 'text-emerald-400'}">
                        </div>
                        <div class="flex items-end">
                            <button onclick="removeAsset(${idx})" class="w-full bg-rose-600/20 text-rose-400 border border-rose-500/30 hover:bg-rose-600/30 py-1.5 rounded-lg transition font-semibold">Delete Asset</button>
                        </div>
                    </div>
                `;
            });

            // Render Ledger Editors with Dropdowns
            const ledgerContainer = document.getElementById('admin-ledger-container');
            ledgerContainer.innerHTML = '';
            currentData.ledger.forEach((item, idx) => {
                let dateOptions = availableDates.map(d => `<option value="${d}" ${item.date === d ? 'selected' : ''}>${d}</option>`).join('');
                let gatewayOptions = availableGateways.map(g => `<option value="${g}" ${item.channel === g ? 'selected' : ''}>${g}</option>`).join('');
                let statusOptions = availableStatuses.map(s => `<option value="${s}" ${item.status === s ? 'selected' : ''}>${s}</option>`).join('');

                ledgerContainer.innerHTML += `
                    <div class="bg-slate-900/60 border border-slate-800 p-4 rounded-xl grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
                        <div>
                            <label class="text-slate-400 block mb-1">Date</label>
                            <select id="ledger-date-${idx}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white">
                                ${dateOptions}
                            </select>
                        </div>
                        <div>
                            <label class="text-slate-400 block mb-1">Description</label>
                            <input type="text" value="${item.desc}" id="ledger-desc-${idx}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white">
                        </div>
                        <div>
                            <label class="text-slate-400 block mb-1">Gateway</label>
                            <select id="ledger-chan-${idx}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white font-semibold">
                                ${gatewayOptions}
                            </select>
                        </div>
                        <div>
                            <label class="text-slate-400 block mb-1">Amount (e.g. +$1,000.00)</label>
                            <input type="text" value="${item.amount}" id="ledger-amt-${idx}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white font-mono">
                        </div>
                        <div>
                            <label class="text-slate-400 block mb-1">Status</label>
                            <select id="ledger-stat-${idx}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white">
                                ${statusOptions}
                            </select>
                        </div>
                        <div class="flex items-end">
                            <button onclick="removeLedger(${idx})" class="w-full bg-rose-600/20 text-rose-400 border border-rose-500/30 hover:bg-rose-600/30 py-2 rounded-lg transition font-semibold">Delete Record</button>
                        </div>
                    </div>
                `;
            });
        }

        function calculateRowPnl(idx) {
            let invested = parseFloat(document.getElementById(`asset-inv-${idx}`).value) || 0;
            let buy = parseFloat(document.getElementById(`asset-buy-${idx}`).value) || 0;
            let curr = parseFloat(document.getElementById(`asset-curr-${idx}`).value) || 0;

            let previewEl = document.getElementById(`asset-pnl-preview-${idx}`);

            if (buy === 0) {
                previewEl.value = "$0.00";
                previewEl.className = "w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 font-mono font-bold text-slate-300";
                return;
            }

            let pnlVal = invested * ((curr - buy) / buy);
            let formattedPnl = (pnlVal >= 0 ? '+' : '') + '$' + Math.abs(pnlVal).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            if (pnlVal < 0) {
                formattedPnl = '-' + '$' + Math.abs(pnlVal).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            }

            previewEl.value = formattedPnl;
            previewEl.className = `w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 font-mono font-bold ${pnlVal >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;
        }

        function addAssetRow() {
            currentData.assets.push({ name: 'New Asset', type: 'Foreign Exchange', investedAmount: 5000, buyPrice: 1.0000, currentPrice: 1.0000, pnl: '+$0.00' });
            loadAdminForm();
        }

        function removeAsset(idx) {
            currentData.assets.splice(idx, 1);
            loadAdminForm();
        }

        function addLedgerRow() {
            currentData.ledger.push({ date: 'August 5, 2026', desc: 'Capital Deposit Made', channel: 'Wire', amount: '$0.00', status: 'Pending' });
            loadAdminForm();
        }

        function removeLedger(idx) {
            currentData.ledger.splice(idx, 1);
            loadAdminForm();
        }

        function saveChanges() {
            currentData.globalInvested = parseFloat(document.getElementById('admin-invested').value) || 0;
            currentData.debtOwed = parseFloat(document.getElementById('admin-debt').value) || 0;

            // Collect Asset Updates
            currentData.assets.forEach((asset, idx) => {
                asset.name = document.getElementById(`asset-name-${idx}`).value;
                asset.type = document.getElementById(`asset-type-${idx}`).value;
                asset.investedAmount = parseFloat(document.getElementById(`asset-inv-${idx}`).value) || 0;
                asset.buyPrice = parseFloat(document.getElementById(`asset-buy-${idx}`).value) || 0;
                asset.currentPrice = parseFloat(document.getElementById(`asset-curr-${idx}`).value) || 0;
                asset.pnl = document.getElementById(`asset-pnl-preview-${idx}`).value;
            });

            // Collect Ledger Updates
            currentData.ledger.forEach((item, idx) => {
                item.date = document.getElementById(`ledger-date-${idx}`).value;
                item.desc = document.getElementById(`ledger-desc-${idx}`).value;
                item.channel = document.getElementById(`ledger-chan-${idx}`).value;
                item.amount = document.getElementById(`ledger-amt-${idx}`).value;
                item.status = document.getElementById(`ledger-stat-${idx}`).value;
            });

            localStorage.setItem('dashboardData', JSON.stringify(currentData));
            alert('Settings and Account History saved successfully! The dashboard has been updated.');
        }

        window.onload = loadAdminForm;
    </script>
</body>
</html>
