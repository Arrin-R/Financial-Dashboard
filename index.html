<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: { colors: { darkbg: '#0f172a', cardbg: '#1e293b', cardborder: '#334155' } }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen p-4 md:p-8 font-sans">

    <div class="max-w-5xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="bg-cardbg border border-cardborder p-6 rounded-2xl shadow-xl flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white uppercase">Client Dashboard</h1>
                <p class="text-slate-400 text-sm mt-1">View your recent account history.</p>
            </div>
            <!-- Secret Link to Admin (You can remove this or hide it later) -->
            <a href="admin.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm font-semibold transition text-slate-300">Admin Portal</a>
        </header>

        <!-- History Ledger View -->
        <div id="view-history" class="bg-cardbg border border-cardborder rounded-2xl p-6 shadow-xl overflow-x-auto">
            <h2 class="text-sm font-bold tracking-tight text-white uppercase border-b border-slate-700 pb-2 mb-4">Account History</h2>
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-slate-800 text-[11px] font-mono uppercase text-slate-400">
                        <th class="py-2 px-4">Date</th>
                        <th class="py-2 px-4">Description</th>
                        <th class="py-2 px-4">Gateway</th>
                        <th class="py-2 px-4 text-right">Amount</th>
                        <th class="py-2 px-4 text-center">Status</th>
                    </tr>
                </thead>
                <!-- Data will be injected here via JavaScript -->
                <tbody id="history-table-body" class="divide-y divide-slate-800/60 text-sm">
                </tbody>
            </table>
        </div>

    </div>

    <!-- Script to Load Data -->
    <script>
        const defaultHistory = [
            { id: 1, date: "June 11, 2026", desc: "Capital Deposit Made", gateway: "Credit", gatewayClass: "text-blue-400 bg-blue-500/10 border-blue-500/20", amount: "+$36,765.00", amountClass: "text-emerald-400", status: "Settled", statusClass: "text-emerald-400 bg-emerald-500/10" },
            { id: 2, date: "June 11, 2026", desc: "Capital Deposit Made", gateway: "USDT", gatewayClass: "text-emerald-400 bg-emerald-500/10 border-emerald-500/20", amount: "+$2,940.00", amountClass: "text-emerald-400", status: "Settled", statusClass: "text-emerald-400 bg-emerald-500/10" },
            { id: 3, date: "June 17, 2026", desc: "Interest Payment Due", gateway: "Scheduled", gatewayClass: "text-slate-500 border-transparent", amount: "$1,838.25", amountClass: "text-amber-400", status: "Due", statusClass: "text-amber-400 bg-amber-500/10" },
            { id: 4, date: "June 17, 2026", desc: "Interest Payment Made", gateway: "VISA", gatewayClass: "text-purple-400 bg-purple-500/10 border-purple-500/20", amount: "$1,838.25", amountClass: "text-white", status: "Cleared", statusClass: "text-emerald-400 bg-emerald-500/10" }
        ];

        function loadHistoryTable() {
            const tbody = document.getElementById('history-table-body');
            if (!tbody) return;

            // Fetch from local storage, or use default if empty
            let historyData = JSON.parse(localStorage.getItem('app_account_history'));
            if (!historyData || historyData.length === 0) {
                historyData = defaultHistory;
                localStorage.setItem('app_account_history', JSON.stringify(historyData));
            }

            tbody.innerHTML = ''; // Clear table
            
            // Build table rows
            historyData.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-800/30 transition";
                tr.innerHTML = `
                    <td class="py-3.5 px-4 font-mono text-xs text-slate-300">${item.date}</td>
                    <td class="py-3.5 px-4 font-medium ${item.desc.includes('Due') ? 'text-slate-400' : 'text-white'}">${item.desc}</td>
                    <td class="py-3.5 px-4"><span class="${item.gatewayClass} text-xs px-2 py-0.5 rounded border ${item.gateway === 'Scheduled' ? '' : 'font-mono'}">${item.gateway}</span></td>
                    <td class="py-3.5 px-4 text-right font-semibold ${item.amountClass} ${item.desc.includes('Due') ? 'font-mono' : ''}">${item.amount}</td>
                    <td class="py-3.5 px-4 text-center"><span class="${item.statusClass} text-xs font-mono px-2 py-0.5 rounded">${item.status}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Initialize when page loads
        window.addEventListener('DOMContentLoaded', () => {
            loadHistoryTable();
        });
    </script>
</body>
</html>
