<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: { colors: { darkbg: '#0f172a', cardbg: '#1e293b', cardborder: '#334155' } }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen p-4 md:p-8 font-sans">

    <div class="max-w-5xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="bg-cardbg border border-cardborder p-6 rounded-2xl shadow-xl flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white uppercase">Client Dashboard</h1>
                <p class="text-slate-400 text-sm mt-1">Manage your investments and account history.</p>
            </div>
            <a href="admin.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm font-semibold transition text-slate-300 border border-slate-700">Admin Portal</a>
        </header>

        <!-- Navigation Tabs -->
        <div class="flex space-x-2 bg-cardbg p-2 rounded-xl border border-cardborder shadow-lg">
            <button onclick="switchTab('dashboard')" id="tab-dashboard" class="flex-1 py-2 rounded-lg text-sm font-bold bg-blue-600 text-white transition">Overview</button>
            <button onclick="switchTab('withdraw')" id="tab-withdraw" class="flex-1 py-2 rounded-lg text-sm font-bold text-slate-400 hover:bg-slate-800 transition">Withdraw</button>
            <button onclick="switchTab('history')" id="tab-history" class="flex-1 py-2 rounded-lg text-sm font-bold text-slate-400 hover:bg-slate-800 transition">History</button>
        </div>

        <!-- VIEW: DASHBOARD (STAT TILES) -->
        <div id="view-dashboard" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <!-- Invested -->
                <div class="bg-cardbg border border-cardborder p-5 rounded-2xl shadow-xl">
                    <p class="text-xs text-slate-400 uppercase tracking-wider font-bold mb-1">Total Invested</p>
                    <h2 id="stat-invested" class="text-2xl font-bold text-white">$0.00</h2>
                </div>
                <!-- PnL -->
                <div class="bg-cardbg border border-cardborder p-5 rounded-2xl shadow-xl">
                    <p class="text-xs text-slate-400 uppercase tracking-wider font-bold mb-1">Current PnL</p>
                    <h2 id="stat-pnl" class="text-2xl font-bold text-emerald-400">$0.00</h2>
                </div>
                <!-- Debt -->
                <div class="bg-cardbg border border-cardborder p-5 rounded-2xl shadow-xl">
                    <p class="text-xs text-slate-400 uppercase tracking-wider font-bold mb-1">Debt Owed</p>
                    <h2 id="stat-debt" class="text-2xl font-bold text-red-400">$0.00</h2>
                </div>
                <!-- Withdrawable -->
                <div class="bg-cardbg border border-cardborder p-5 rounded-2xl shadow-xl">
                    <p class="text-xs text-slate-400 uppercase tracking-wider font-bold mb-1">Available to Withdraw</p>
                    <h2 id="stat-withdrawable" class="text-2xl font-bold text-blue-400">$0.00</h2>
                </div>
            </div>
        </div>

        <!-- VIEW: WITHDRAW -->
        <div id="view-withdraw" class="hidden bg-cardbg border border-cardborder rounded-2xl p-6 shadow-xl">
            <h2 class="text-sm font-bold tracking-tight text-white uppercase border-b border-slate-700 pb-2 mb-4">Request Withdrawal</h2>
            <p class="text-slate-400 text-sm mb-4">Available Balance: <span id="withdraw-balance-display" class="text-white font-bold">$0.00</span></p>
            <form onsubmit="event.preventDefault(); alert('Withdrawal request submitted for processing.');" class="space-y-4 max-w-md">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Amount to Withdraw</label>
                    <input type="text" placeholder="$0.00" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Destination Wallet/Bank</label>
                    <input type="text" placeholder="Enter details..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded-lg transition shadow text-sm">Submit Request</button>
            </form>
        </div>

        <!-- VIEW: HISTORY -->
        <div id="view-history" class="hidden bg-cardbg border border-cardborder rounded-2xl p-6 shadow-xl overflow-x-auto">
            <h2 class="text-sm font-bold tracking-tight text-white uppercase border-b border-slate-700 pb-2 mb-4">Account History</h2>
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-slate-800 text-[11px] font-mono uppercase text-slate-400">
                        <th class="py-2 px-4">Date</th>
                        <th class="py-2 px-4">Description</th>
                        <th class="py-2 px-4">Gateway</th>
                        <th class="py-2 px-4 text-right">Amount</th>
                        <th class="py-2 px-4 text-center">Status</th>
                    </tr>
                </thead>
                <tbody id="history-table-body" class="divide-y divide-slate-800/60 text-sm">
                </tbody>
            </table>
        </div>

    </div>

    <!-- Logic Script -->
    <script>
        // Tab Switching Logic
        function switchTab(tabId) {
            // Hide all views
            document.getElementById('view-dashboard').classList.add('hidden');
            document.getElementById('view-withdraw').classList.add('hidden');
            document.getElementById('view-history').classList.add('hidden');
            
            // Reset tab styles
            const tabs = ['tab-dashboard', 'tab-withdraw', 'tab-history'];
            tabs.forEach(t => {
                document.getElementById(t).className = "flex-1 py-2 rounded-lg text-sm font-bold text-slate-400 hover:bg-slate-800 transition";
            });

            // Show active view & style active tab
            document.getElementById('view-' + tabId).classList.remove('hidden');
            document.getElementById('tab-' + tabId).className = "flex-1 py-2 rounded-lg text-sm font-bold bg-blue-600 text-white transition";
        }

        // Load Dashboard Stats
        function loadStats() {
            const defaultStats = { invested: "$0.00", pnl: "+$0.00", debt: "$0.00", withdrawable: "$0.00" };
            let stats = JSON.parse(localStorage.getItem('app_dashboard_stats')) || defaultStats;
            
            document.getElementById('stat-invested').innerText = stats.invested;
            document.getElementById('stat-pnl').innerText = stats.pnl;
            document.getElementById('stat-debt').innerText = stats.debt;
            document.getElementById('stat-withdrawable').innerText = stats.withdrawable;
            document.getElementById('withdraw-balance-display').innerText = stats.withdrawable;
        }

        // Load History Table (Same as before)
        function loadHistoryTable() {
            const tbody = document.getElementById('history-table-body');
            let historyData = JSON.parse(localStorage.getItem('app_account_history')) || [];
            
            tbody.innerHTML = ''; 
            if(historyData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="py-4 text-center text-slate-500 text-sm">No transactions found.</td></tr>';
                return;
            }

            historyData.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-800/30 transition";
                tr.innerHTML = `
                    <td class="py-3.5 px-4 font-mono text-xs text-slate-300">${item.date}</td>
                    <td class="py-3.5 px-4 font-medium ${item.desc.includes('Due') ? 'text-slate-400' : 'text-white'}">${item.desc}</td>
                    <td class="py-3.5 px-4"><span class="${item.gatewayClass} text-xs px-2 py-0.5 rounded border ${item.gateway === 'Scheduled' ? '' : 'font-mono'}">${item.gateway}</span></td>
                    <td class="py-3.5 px-4 text-right font-semibold ${item.amountClass}">${item.amount}</td>
                    <td class="py-3.5 px-4 text-center"><span class="${item.statusClass} text-xs font-mono px-2 py-0.5 rounded">${item.status}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Initialize when page loads
        window.addEventListener('DOMContentLoaded', () => {
            loadStats();
            loadHistoryTable();
        });
    </script>
</body>
</html>
