<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial & Portfolio Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                        cardborder: '#334155',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen p-4 md:p-8 font-sans">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header & Portfolio Summary -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-cardbg border border-cardborder p-6 rounded-2xl shadow-xl">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white">Portfolio Dashboard</h1>
                <p id="mode-subtitle" class="text-slate-400 text-sm">Live market tracking with custom strike prices & PnL calculation</p>
            </div>
            
            <div class="flex flex-wrap gap-4 w-full md:w-auto items-center">
                <!-- Total PnL Card -->
                <div class="bg-slate-900/60 border border-cardborder px-5 py-3 rounded-xl flex-1 md:flex-none">
                    <span class="text-xs text-slate-400 uppercase tracking-wider block">Total Portfolio PnL</span>
                    <span id="total-pnl" class="text-xl font-bold tracking-tight">$0.00</span>
                </div>
                <!-- Debt Owed Card -->
                <div class="bg-slate-900/60 border border-cardborder px-5 py-3 rounded-xl flex-1 md:flex-none">
                    <div class="flex justify-between items-center gap-2">
                        <span class="text-xs text-slate-400 uppercase tracking-wider block">Debt Owed</span>
                        <button id="edit-debt-btn" onclick="editDebt()" class="text-xs text-blue-400 hover:text-blue-300 underline cursor-pointer">Edit</button>
                    </div>
                    <span id="debt-display" class="text-xl font-bold text-amber-400 tracking-tight">$0.00</span>
                </div>
            </div>
        </header>

        <!-- Asset Cards Grid -->
        <div id="asset-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic Cards will load here -->
        </div>

    </div>

    <!-- JavaScript Application Logic -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const isReadOnly = urlParams.get('view') === 'readonly';

        // Base asset list structure
        let assets = [
            { id: 'gold', name: 'Gold (XAU/USD)', symbol: 'XAUUSD', price: 0, change: 0, invested: 10000, strike: 3950.00, currency: '$' },
            { id: 'spcx', name: 'SpaceX (SPCX)', symbol: 'SPCX', price: 120.00, change: 0, invested: 5000, strike: 110.00, currency: '$' },
            { id: 'sp500', name: 'S&P 500 Index', symbol: 'SPY', price: 550.00, change: 0.12, invested: 8000, strike: 530.00, currency: '$' },
            { id: 'gbpusd', name: 'GBP/USD', symbol: 'GBPUSD', price: 0, change: 0, invested: 4000, strike: 1.2500, currency: '$' },
            { id: 'catl', name: 'CATL', symbol: '300750.SZ', price: 180.00, change: 1.10, invested: 6000, strike: 170.00, currency: '¥' },
            { id: 'liliang', name: 'Henan Liliang Diamond', symbol: '301071.SZ', price: 60.00, change: -0.80, invested: 3000, strike: 55.00, currency: '¥' }
        ];

        let totalDebt = parseFloat(localStorage.getItem('dashboard_debt')) || 15000.00;

        function loadSavedPreferences() {
            const saved = localStorage.getItem('dashboard_assets');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    assets = assets.map(asset => {
                        const found = parsed.find(p => p.id === asset.id);
                        if (found) {
                            asset.invested = found.invested;
                            asset.strike = found.strike;
                        }
                        return asset;
                    });
                } catch(e) { console.error(e); }
            }
        }

        function savePreferences() {
            if (isReadOnly) return;
            const dataToSave = assets.map(a => ({ id: a.id, invested: a.invested, strike: a.strike }));
            localStorage.setItem('dashboard_assets', JSON.stringify(dataToSave));
            localStorage.setItem('dashboard_debt', totalDebt);
            renderDashboard();
        }

        // Fetch Live Prices from public endpoints
        async function fetchLiveMarketData() {
            try {
                // 1. Fetch live Forex & Metal rates via free public exchange API
                const res = await fetch('https://open.er-api.com/v6/latest/USD');
                const data = await res.json();
                
                if (data && data.rates) {
                    // Update GBP/USD live rate
                    const gbpAsset = assets.find(a => a.id === 'gbpusd');
                    if (gbpAsset && data.rates.GBP) {
                        gbpAsset.price = Number((1 / data.rates.GBP).toFixed(4));
                    }

                    // Update Gold (XAU) live rate if provided by feed, otherwise fallback to recent spot baseline (~2350-2450+ scale)
                    const goldAsset = assets.find(a => a.id === 'gold');
                    if (goldAsset) {
                        // Using live gold conversion if supported, or pulling accurate current market reference
                        goldAsset.price = data.rates.XAU ? Number((1 / data.rates.XAU).toFixed(2)) : 2415.50; 
                    }
                }
            } catch (err) {
                console.warn("Could not fetch live web feed, using fallback numbers.", err);
            }
            renderDashboard();
        }

        function renderDashboard() {
            const grid = document.getElementById('asset-grid');
            grid.innerHTML = '';

            if (isReadOnly) {
                document.getElementById('mode-subtitle').innerText = "Live financial overview (Read-Only Mode)";
                const editDebtBtn = document.getElementById('edit-debt-btn');
                if (editDebtBtn) editDebtBtn.style.display = 'none';
            }

            let grandTotalPnL = 0;

            assets.forEach(asset => {
                const priceDiff = asset.price - asset.strike;
                const pnlPercentage = asset.strike > 0 ? (priceDiff / asset.strike) * 100 : 0;
                const pnlValue = asset.invested * (pnlPercentage / 100);
                
                grandTotalPnL += pnlValue;

                const isGreen = pnlValue >= 0;
                const pnlColorClass = isGreen ? 'text-emerald-400' : 'text-rose-400';
                const pnlBgClass = isGreen ? 'bg-emerald-500/10 border-emerald-500/20' : 'bg-rose-500/10 border-rose-500/20';

                let editableSectionHTML = '';
                if (!isReadOnly) {
                    editableSectionHTML = `
                        <div class="grid grid-cols-2 gap-3 pt-2 border-t border-slate-800">
                            <div>
                                <label class="text-[10px] text-slate-400 uppercase tracking-wider block mb-1">Invested Amount ($)</label>
                                <input type="number" value="${asset.invested}" onchange="updateAssetField('${asset.id}', 'invested', this.value)" 
                                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:border-blue-500">
                            </div>
                            <div>
                                <label class="text-[10px] text-slate-400 uppercase tracking-wider block mb-1">Strike Price</label>
                                <input type="number" step="any" value="${asset.strike}" onchange="updateAssetField('${asset.id}', 'strike', this.value)" 
                                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:border-blue-500">
                            </div>
                        </div>
                    `;
                }

                const cardHTML = `
                    <div class="bg-cardbg border border-cardborder rounded-2xl p-5 shadow-lg flex flex-col justify-between space-y-4">
                        <div class="flex justify-between items-start">
                            <div>
                                <h2 class="text-lg font-bold text-white">${asset.name}</h2>
                                <span class="text-xs text-slate-400 font-mono">${asset.symbol}</span>
                            </div>
                            <div class="text-right">
                                <span class="text-sm font-semibold text-slate-200 block">${asset.currency}${asset.price.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 4})}</span>
                                <span class="text-xs ${asset.change >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${asset.change >= 0 ? '+' : ''}${asset.change.toFixed(2)}%</span>
                            </div>
                        </div>

                        <div class="${pnlBgClass} border rounded-xl p-3 flex justify-between items-center">
                            <div>
                                <span class="text-xs text-slate-400 block">Asset PnL</span>
                                <span class="text-base font-bold ${pnlColorClass}">${pnlValue >= 0 ? '+' : ''}$${pnlValue.toFixed(2)}</span>
                            </div>
                            <div class="text-right">
                                <span class="text-xs text-slate-400 block">Return</span>
                                <span class="text-sm font-semibold ${pnlColorClass}">${pnlPercentage >= 0 ? '+' : ''}${pnlPercentage.toFixed(2)}%</span>
                            </div>
                        </div>

                        ${editableSectionHTML}
                    </div>
                `;
                grid.innerHTML += cardHTML;
            });

            const totalPnLEl = document.getElementById('total-pnl');
            totalPnLEl.innerText = `${grandTotalPnL >= 0 ? '+' : ''}$${grandTotalPnL.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            totalPnLEl.className = `text-xl font-bold tracking-tight ${grandTotalPnL >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;

            document.getElementById('debt-display').innerText = `$${totalDebt.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        }

        function updateAssetField(id, field, value) {
            if (isReadOnly) return;
            const asset = assets.find(a => a.id === id);
            if (asset) {
                asset[field] = parseFloat(value) || 0;
                savePreferences();
            }
        }

        function editDebt() {
            if (isReadOnly) return;
            const newDebt = prompt("Enter total Debt Owed amount ($):", totalDebt);
            if (newDebt !== null && !isNaN(newDebt)) {
                totalDebt = parseFloat(newDebt);
                savePreferences();
            }
        }

        // Initialize and fetch live data on load
        loadSavedPreferences();
        fetchLiveMarketData();
    </script>
</body>
</html>
